[package]
name = "glafira-pg"
version = "0.6.0"
description = "Glafira for PostgreSQL — диагностика PostgreSQL и кластеров Patroni"
authors = ["Glafira for PostgreSQL contributors"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vvnovg/glafira-postgres"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не совпало с именем бинаря (Windows, cargo#8519).
name = "glafira_pg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "io-util", "io-std", "process"] }
# SOCKS5 к узлу через порт туннеля `ssh -D` (имя узла разрешает бастион).
tokio-socks = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
plist = "1"
dirs = "7"
sys-locale = "0.3"
percent-encoding = "2"
# `with-serde_json-1`: колонка `json` ответа EXPLAIN читается как `serde_json::Value`.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# `BytesMut` для `ToSql` параметров EXPLAIN (`explain::run::TextParam`): документированный путь вместо скрытого
# `tokio_postgres::types::private`. Крейт и так в дереве зависимостей через tokio-postgres.
bytes = "1"
postgres-openssl = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
# Коды X509_V_ERR_* причины отказа проверки сертификата: в крейте openssl констант для них нет.
openssl-sys = "0.9"
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks"] }
futures-util = "0.3"
socket2 = { version = "0.6", features = ["all"] }
pg-advisor = { path = "../crates/pg-advisor" }
# MCP-шлюз (P4): ядро (транспорт, сессии, подтверждение, журнал) и инструменты PostgreSQL.
glafira-mcp-core = { path = "../crates/glafira-mcp-core" }
glafira-pg-mcp = { path = "../crates/glafira-pg-mcp" }
# Токен `mcp.json`: 32 байта из генератора ОС (версия уже в дереве зависимостей).
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
# Клиент MCP в тестах контроллера и в интеграции `it_mcp` (версия — как у крейтов шлюза).
rmcp = { version = "3.5.1", features = ["client", "transport-async-rw"] }
# `CancellationToken` в тестах наблюдения MCP (крейт уже в дереве через rmcp).
tokio-util = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
