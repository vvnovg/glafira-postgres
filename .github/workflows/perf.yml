name: perf

# Тесты на стенде тяжёлых запросов pg-perf (it_queries, it_explain). Образ pg-perf собирается из пакетов PGDG на каждом
# запуске, поэтому они не идут на каждый push (спец. P3 §15 п. 16): ночью и по кнопке.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ветка stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      # Сборка фронтенда: контекст Tauri в тестовых бинарниках требует dist.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Ключи bastion
        run: dev/ssh/gen-keys.sh
      - name: Стенд с pg-perf и матрицей
        # Матрица и пара primary/replica нужны частям тех же тестов (PG 13 и 15, реплика).
        run: |
          docker compose -f dev/docker-compose.yml --profile matrix --profile perf up -d --build
          scripts/wait-stand.sh
          scripts/wait-matrix.sh
          scripts/wait-perf.sh
      - name: it_queries и it_explain
        run: cargo test --manifest-path src-tauri/Cargo.toml --test it_queries --test it_explain --test it_hypopg -- --test-threads=1
        env:
          GPG_IT_SINGLE: localhost:5460
          GPG_IT_PRIMARY: localhost:5451
          GPG_IT_REPLICA: localhost:5452
          GPG_IT_PERF: localhost:5471
          GPG_IT_MATRIX: localhost:5513,localhost:5514,localhost:5515,localhost:5516,localhost:5517,localhost:5518
      - name: Логи стенда при сбое
        if: failure()
        run: docker compose -f dev/docker-compose.yml --profile matrix --profile perf logs --tail=200
