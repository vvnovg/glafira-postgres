name: glafira-pg-dev

x-patroni: &patroni
  build:
    context: .
    dockerfile: patroni/Dockerfile
  image: glafira-pg-dev/patroni:17
  depends_on: [etcd]

# Матрица версий: одиночные узлы PostgreSQL 13…18 с той же демо-схемой (профиль `matrix`, в обычный `up` не входит).
x-matrix: &matrix
  profiles: ["matrix"]
  environment:
    POSTGRES_PASSWORD: postgres-secret
  command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
  volumes:
    - ./sql/init.sql:/docker-entrypoint-initdb.d/20-init.sql:ro

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: gp-etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380

  patroni1:
    <<: *patroni
    container_name: gp-patroni1
    hostname: patroni1
    environment:
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
    # Стенд слушает только loopback: учётные данные известные.
    ports: ["127.0.0.1:5441:5432", "127.0.0.1:8011:8008"]

  patroni2:
    <<: *patroni
    container_name: gp-patroni2
    hostname: patroni2
    environment:
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
    ports: ["127.0.0.1:5442:5432", "127.0.0.1:8012:8008"]

  patroni3:
    <<: *patroni
    container_name: gp-patroni3
    hostname: patroni3
    environment:
      PATRONI_NAME: patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni3:5432
    ports: ["127.0.0.1:5443:5432", "127.0.0.1:8013:8008"]

  pg-primary:
    image: postgres:16
    container_name: gp-pg-primary
    hostname: pg-primary
    environment:
      POSTGRES_PASSWORD: postgres-secret
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    volumes:
      - ./primary/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/20-init.sql:ro
    ports: ["127.0.0.1:5451:5432"]

  pg-replica:
    image: postgres:16
    container_name: gp-pg-replica
    hostname: pg-replica
    depends_on: [pg-primary]
    user: postgres
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICATION_PASSWORD: replicator-secret
    volumes:
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports: ["127.0.0.1:5452:5432"]

  pg-single:
    image: postgres:15
    container_name: gp-pg-single
    environment:
      POSTGRES_PASSWORD: postgres-secret
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/20-init.sql:ro
    ports: ["127.0.0.1:5460:5432"]

  # SSH-бастион для проверки туннеля: имена узлов (pg-single, patroni1…) разрешаются во внутренней сети compose.
  # Ключи tester генерирует dev/ssh/gen-keys.sh (до `up --build`), в репозитории их нет.
  bastion:
    build:
      context: .
      dockerfile: ssh/Dockerfile
    image: glafira-pg-dev/bastion
    container_name: gp-bastion
    hostname: bastion
    ports: ["127.0.0.1:2222:22"]

  # Матрица версий (профиль `matrix`): `docker compose -f dev/docker-compose.yml --profile matrix up -d --no-recreate`.
  # Порты 127.0.0.1:5513…5518 — по номеру версии; роль glafira_diag и база orders — из sql/init.sql.
  pg13:
    <<: *matrix
    image: postgres:13
    container_name: gp-pg13
    ports: ["127.0.0.1:5513:5432"]
  pg14:
    <<: *matrix
    image: postgres:14
    container_name: gp-pg14
    ports: ["127.0.0.1:5514:5432"]
  pg15:
    <<: *matrix
    image: postgres:15
    container_name: gp-pg15
    ports: ["127.0.0.1:5515:5432"]
  pg16:
    <<: *matrix
    image: postgres:16
    container_name: gp-pg16
    ports: ["127.0.0.1:5516:5432"]
  pg17:
    <<: *matrix
    image: postgres:17
    container_name: gp-pg17
    ports: ["127.0.0.1:5517:5432"]
  pg18:
    <<: *matrix
    image: postgres:18
    container_name: gp-pg18
    ports: ["127.0.0.1:5518:5432"]
